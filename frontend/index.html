<!doctype html>
<html lang="en" data-mode="school">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentOS</title>
<style>
:root{--accent:#6366f1;--accent2:#a855f7;--stroke:rgba(255,255,255,.16);--tx:#f1f3fa;--mut:rgba(241,243,250,.62);--bad:#fb7185}
html[data-mode=dev]{--accent:#10b981;--accent2:#22d3ee}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:16px;gap:16px;display:flex;background:#070914;color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 800px at 80% 110%,#1a1040,#070914)}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.5;animation:float 24s ease-in-out infinite alternate;transition:background 1s}
.b1{width:560px;height:560px;background:var(--accent);top:-160px;left:-120px}
.b2{width:520px;height:520px;background:var(--accent2);right:-140px;bottom:-140px;animation-delay:-8s}
.b3{width:380px;height:380px;background:#ec4899;top:38%;left:42%;opacity:.28;animation-delay:-14s}
@keyframes float{to{transform:translate(70px,-50px) scale(1.15)}}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--stroke);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:rgba(255,255,255,.08);border:1px solid var(--stroke);border-radius:12px;padding:7px 14px;cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.16)}
button:disabled{opacity:.6;cursor:default}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
button.danger{background:linear-gradient(135deg,#f43f5e,#be123c);border-color:transparent;color:#fff}
input,textarea,select{background:rgba(0,0,0,.28);border:1px solid var(--stroke);border-radius:12px;padding:9px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:0}
textarea{resize:vertical}
aside{width:220px;flex:none;padding:18px;display:flex;flex-direction:column;gap:6px}
aside h1{margin:0 0 12px;font-size:20px;letter-spacing:-.3px;background:linear-gradient(135deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.modes{display:flex;gap:6px;margin-bottom:12px;padding:4px;border-radius:14px;background:rgba(0,0,0,.25)}
.modes button{flex:1;border:0;background:none}.modes button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.nav{text-align:left;border:0;background:none;border-radius:12px}.nav.active{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
main{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
header{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap}
.pill{border:1px solid var(--stroke);background:rgba(255,255,255,.06);border-radius:99px;padding:2px 12px;font-size:12px;color:var(--mut)}
section{display:none;flex:1;padding:20px;overflow:auto;min-height:0}section.active{display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.h1{font-size:22px;font-weight:650;letter-spacing:-.3px}
.mut{color:var(--mut)}.err{color:var(--bad)}
.card{background:rgba(255,255,255,.07);border:1px solid var(--stroke);border-radius:14px;padding:10px 14px}
.list{display:flex;flex-direction:column;gap:8px;overflow:auto}
.grid{display:grid;grid-template-columns:260px 1fr;gap:14px;flex:1;min-height:0}
code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:6px}
/* homework */
.filters{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid var(--stroke)}
.fgrp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flabel{width:62px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.chip{--c:var(--accent);padding:4px 12px;border-radius:99px;font-size:12.5px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:color-mix(in srgb,var(--c) 38%,transparent);border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 35%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.day{margin-top:8px}
.dayhead{display:flex;gap:10px;align-items:baseline;margin:6px 2px 8px}
.dayhead b{font-size:15px}.dayhead .rel{font-size:12px;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.1)}
.dayhead .rel.hot{background:rgba(244,63,94,.35);color:#ffe4e6}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;grid-auto-flow:dense}
.task{--c:#6366f1;position:relative;padding:12px 14px;border-radius:16px;overflow:hidden;cursor:pointer;
 background:linear-gradient(145deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 7%,transparent));
 border:1px solid color-mix(in srgb,var(--c) 50%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
 box-shadow:0 6px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,box-shadow .15s}
.task:hover{transform:translateY(-3px);box-shadow:0 12px 30px color-mix(in srgb,var(--c) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.task .course{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--c) 40%,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%}
.task .t{font-weight:600;margin:3px 0 8px;line-height:1.3}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;padding:1px 9px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12)}
.task.big{grid-column:span 2;padding:18px 20px;min-height:120px}
.task.big .t{font-size:19px}
.task.mid .t{font-size:14.5px}
.task.small{padding:9px 12px}.task.small .t{font-size:13px;margin-bottom:6px}
.task.done{opacity:.5}.task.done .t{text-decoration:line-through}
.check{position:absolute;right:10px;top:8px;font-size:15px;color:#86efac}
.spin{display:none;width:12px;height:12px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;margin-right:8px;vertical-align:-1px}
.busy .spin{display:inline-block}@keyframes rot{to{transform:rotate(360deg)}}
.empty{padding:50px;text-align:center}
/* chat / terminal */
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:860px;padding:11px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--stroke)}
.msg.user{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 40%,transparent),color-mix(in srgb,var(--accent2) 25%,transparent));align-self:flex-end}
.code{margin:6px 0}.code pre{margin:0;background:rgba(0,0,0,.45);border:1px solid var(--stroke);border-radius:10px;padding:10px;overflow:auto;white-space:pre-wrap}
.run{margin-top:4px;font-size:12px}
pre#termlog{flex:1;margin:0;background:rgba(0,0,0,.4);border:1px solid var(--stroke);border-radius:14px;padding:12px;overflow:auto;white-space:pre-wrap;min-height:200px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
#modal .box{padding:22px;max-width:560px;width:92%;border-color:rgba(251,113,133,.6)}
#modal pre{background:rgba(0,0,0,.45);padding:10px;border-radius:10px;white-space:pre-wrap;overflow:auto}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}
.msel{width:auto;max-width:210px;padding:3px 12px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.1);cursor:pointer}
select option{background:#14162e;color:#fff}
.small{font-size:12px}
#tab-dashboard{padding:0;background:none;border:0;box-shadow:none;gap:16px;overflow:visible}
.dbar{display:flex;align-items:center;gap:10px;padding:10px 16px}
#tab-dashboard .eo{display:none}
#tab-dashboard.edit .eo{display:inline-block}
#dgw{flex:1;min-height:0;overflow:auto;border-radius:20px}
#grid{position:relative}
#ghost{position:absolute;display:none;border-radius:18px;background:color-mix(in srgb,var(--accent) 22%,transparent);border:2px dashed var(--accent);transition:all .12s;pointer-events:none}
.w{position:absolute;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;
 background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
 border:1px solid var(--stroke);box-shadow:0 10px 36px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);
 transition:left .18s,top .18s,width .18s,height .18s,box-shadow .15s}
.w.drag{transition:none;z-index:50;box-shadow:0 24px 60px rgba(0,0,0,.55);opacity:.93}
.edit .w{outline:1px dashed color-mix(in srgb,var(--accent) 65%,transparent)}
.wh{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--stroke);user-select:none;touch-action:none}
.edit .wh{cursor:grab}.edit .wh:active{cursor:grabbing}
.rm{display:none;padding:0 9px;line-height:22px;font-size:16px;border-radius:8px}
.edit .rm{display:inline-block}
.rm:hover{background:rgba(244,63,94,.55)}
.rz{display:none;position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;z-index:5;touch-action:none}
.edit .rz{display:block}
.rz::after{content:"";position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut)}
.w .wb{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.w .wb>*{flex:none}
.w .wb>.grow{flex:1 1 0;min-height:0}
.w .row{gap:6px}.w .row input{flex:1;min-width:0}
.w .msg{padding:8px 10px;font-size:13px;max-width:100%}
.pal{position:absolute;right:0;top:calc(100% + 8px);z-index:80;width:310px;display:none;flex-direction:column;gap:2px;padding:8px}
.pal.show{display:flex}
.pi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:none;width:100%}
.pi:hover{background:rgba(255,255,255,.13)}
.stat .bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.spark{width:100%;height:48px;flex:none}
.tlog{margin:0;background:rgba(0,0,0,.4);border:1px solid var(--stroke);border-radius:10px;padding:8px;overflow:auto;white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace}
.cmsgs{overflow:auto;display:flex;flex-direction:column;gap:8px}
.hwi{--c:var(--accent);border-left:4px solid var(--c);background:linear-gradient(120deg,color-mix(in srgb,var(--c) 24%,transparent),rgba(255,255,255,.03));border-radius:10px;padding:7px 10px;cursor:pointer}
.hwi:hover{filter:brightness(1.2)}
.hwt{font-weight:600;font-size:13px;line-height:1.3}
.hwm{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);gap:8px}
.hwm .hot{color:#fda4af}
.mopt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;--c:var(--accent)}
.mopt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 30%,transparent)}
.mopt em{margin-left:auto;font-style:normal;font-size:11px;color:var(--accent)}
.skb{display:none;white-space:pre-wrap;margin:6px 0 0;font-size:12px}
.sk{cursor:pointer}.sk.open .skb{display:block}
.fi{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer}
.fi:hover{background:rgba(255,255,255,.12)}
.fv{white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;margin:8px 0 0}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;padding:9px 18px;border-radius:99px;background:rgba(20,22,46,.9);border:1px solid var(--stroke);transition:.25s;pointer-events:none;z-index:200}
#toast.show{opacity:1;transform:translate(-50%,0)}

</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<aside class="glass">
  <h1>AgentOS</h1>
  <div class="modes"><button id="m-school" data-mode="school">School</button><button id="m-dev" data-mode="dev">Dev</button></div>
  <button class="nav active" data-tab="dashboard">Dashboard</button>
  <button class="nav" data-tab="chat">Agent Chat</button>
  <button class="nav" data-tab="homework">Homework</button>
  <button class="nav" data-tab="skills">Skills</button>
  <button class="nav" data-tab="memory">Memory</button>
  <button class="nav" data-tab="terminal">Terminal</button>
</aside>
<main>
  <header class="glass"><span class="pill" id="p-mode"></span><span class="pill" id="p-ollama"></span><select id="modelsel" class="msel" title="Active model"></select><span class="pill" id="p-cpu"></span><span class="pill" id="p-ram"></span><span class="pill" id="p-tasks"></span></header>

  <section id="tab-dashboard" class="dash active">
    <div class="glass dbar">
      <div class="h1">Dashboard</div>
      <span class="mut small eo">Drag a title bar to move - drag the corner to resize</span>
      <span style="flex:1"></span>
      <div style="position:relative"><button id="addw" class="eo">+ Add widget</button><div id="palette" class="glass pal"></div></div>
      <button id="resetw" class="eo">Reset</button>
      <button id="editw" class="primary">Customize</button>
    </div>
    <div id="dgw"><div id="grid"><div id="ghost"></div></div></div>
  </section>

  <section id="tab-chat" class="glass">
    <div id="msgs"></div>
    <div class="row"><textarea id="chatin" rows="2" placeholder="Message AgentOS (mention a skill name to load its instructions). Enter = send"></textarea><button class="primary" id="chatsend">Send</button></div>
  </section>

  <section id="tab-homework" class="glass">
    <div class="row"><div><div class="h1">Homework</div><div class="mut" id="tmeta"></div></div><button class="primary" id="syncbtn"><span class="spin"></span><span id="synctxt">Sync now</span></button></div>
    <div class="err" id="terr"></div>
    <div class="filters" id="filters"></div>
    <div class="mut" id="tcount"></div>
    <div id="tasklist"></div>
  </section>

  <section id="tab-skills" class="glass">
    <div class="grid">
      <div class="list" id="skilllist"></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="sk-name" placeholder="skill-name"><input id="sk-desc" placeholder="Short description">
        <textarea id="sk-body" rows="14" placeholder="Markdown instructions"></textarea>
        <div class="row"><span class="mut" id="sk-msg"></span><span><button id="sk-new">New</button> <button class="danger" id="sk-del">Delete</button> <button class="primary" id="sk-save">Save to /skills</button></span></div>
      </div>
    </div>
  </section>

  <section id="tab-memory" class="glass">
    <div class="mut">memory/long_term.md - included in every agent prompt (last 6000 chars).</div>
    <textarea id="memtext" style="flex:1"></textarea>
    <div class="row"><span class="mut" id="mem-msg"></span><button class="primary" id="mem-save">Save</button></div>
  </section>

  <section id="tab-terminal" class="glass">
    <div class="row"><select id="lang" style="width:110px"><option value="shell">shell</option><option value="python">python</option></select><input id="cmd" placeholder="e.g. brew list  |  git status"><button class="primary" id="runbtn">Run</button></div>
    <pre id="termlog"></pre>
  </section>
</main>

<div id="modal"><div class="box glass">
  <h3 class="err" style="margin-top:0">High-risk command - confirmation required</h3>
  <pre id="m-cmd"></pre><div id="m-why" class="mut"></div><br>
  <div class="row" style="justify-content:flex-end"><button id="m-abort">Abort</button><button class="danger" id="m-ok">Authorize Execution</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s), FENCE='\x60'.repeat(3);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d=null;try{d=await r.json()}catch{}return{ok:r.ok,status:r.status,data:d}}
const post=(u,b)=>api(u,{method:'POST',body:JSON.stringify(b)});

/* tabs & mode */
function showTab(t){document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===t));
  if(t==='homework')loadTasks();if(t==='skills')loadSkills();if(t==='memory')loadMemory();}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>showTab(n.dataset.tab));
document.querySelectorAll('.modes button').forEach(b=>b.onclick=async()=>{await post('/api/mode',{mode:b.dataset.mode});await refresh();showTab('dashboard')});
let lastSync;
async function refresh(){
  const {data:s}=await api('/api/status');if(!s)return;window.onStatus&&window.onStatus(s);
  document.documentElement.dataset.mode=s.mode;
  $('#m-school').classList.toggle('active',s.mode==='school');$('#m-dev').classList.toggle('active',s.mode==='dev');
  $('#p-mode').textContent='Mode: '+s.mode;
  $('#p-ollama').textContent=s.ollama.online?('Ollama - '+(s.ollama.model||'no model installed')):'Ollama offline';
  $('#p-cpu').textContent='CPU '+s.cpu_percent+'%';$('#p-ram').textContent='RAM '+s.ram.used_gb+'/'+s.ram.total_gb+' GB ('+s.ram.percent+'%)';
  $('#p-tasks').textContent=s.task_count+' tasks';
  if(lastSync!==undefined&&s.last_sync!==lastSync&&$('#tab-homework').classList.contains('active'))loadTasks();
  lastSync=s.last_sync;
}
setInterval(refresh,3000);refresh();

/* homework */
let T=[];
const F={range:'2w',status:'all',course:new Set(),type:new Set()};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysTo=t=>t.due_iso?Math.round((new Date(t.due_iso).setHours(0,0,0,0)-today0())/864e5):null;
const isDone=t=>{const s=(t.status||'').toLowerCase().trim();if(/not |pending|missing|late|overdue|incomplete/.test(s))return false;return /complete|submitted|turned in|graded|excused/.test(s)||/^[\d.]+(\s*\/\s*[\d.]+)?%?$/.test(s);};
const catOf=t=>{const s=(t.description||'').toLowerCase();return /home learning/.test(s)?'Home learning':/summative/.test(s)?'Summative':/formative/.test(s)?'Formative':'Other';};
const shortType=t=>(t.description||'').replace(/^MYP\s+/i,'')||'Task';
const cleanCourse=c=>(!c||/new updates?|^\d+$|^-+$/i.test(c))?'Class':c;
function colorMap(){const names=[...new Set(T.map(t=>cleanCourse(t.course)))].sort();const m={};names.forEach((n,i)=>m[n]='hsl('+Math.round((i*137.5+230)%360)+',72%,62%)');return m;}
async function loadTasks(){
  const {data}=await api('/api/tasks');if(!data)return;T=data.tasks||[];
  $('#tmeta').textContent=data.last_sync?'Last sync '+new Date(data.last_sync).toLocaleString():'Never synced';
  if(data.last_sync_error)$('#terr').textContent=data.last_sync_error;
  renderTasks();
}
function renderTasks(){
  const cm=colorMap(),courses=Object.keys(cm),cats=['Home learning','Formative','Summative','Other'].filter(c=>T.some(t=>catOf(t)===c));
  const chip=(k,v,label,on,col)=>`<button class="chip${on?' on':''}" data-k="${k}" data-v="${esc(v)}"${col?` style="--c:${col}"`:''}>${col?'<i class="dot"></i>':''}${esc(label)}</button>`;
  const grp=(l,h)=>`<div class="fgrp"><span class="flabel">${l}</span>${h}</div>`;
  $('#filters').innerHTML=
    grp('Range',[['2w','Next 2 weeks'],['overdue','Overdue'],['all','All']].map(([v,l])=>chip('range',v,l,F.range===v)).join(''))+
    grp('Status',[['all','All'],['pending','Pending'],['done','Done']].map(([v,l])=>chip('status',v,l,F.status===v)).join(''))+
    (cats.length?grp('Type',cats.map(c=>chip('type',c,c,F.type.has(c))).join('')):'')+
    (courses.length?grp('Course',courses.map(c=>chip('course',c,c,F.course.has(c),cm[c])).join('')):'');
  const list=T.map(t=>({t,d:daysTo(t),done:isDone(t),course:cleanCourse(t.course)})).filter(x=>{
    if(F.range==='2w'&&!(x.d!==null&&x.d>=0&&x.d<=14))return false;
    if(F.range==='overdue'&&!(x.d!==null&&x.d<0&&!x.done))return false;
    if(F.status==='pending'&&x.done)return false;if(F.status==='done'&&!x.done)return false;
    if(F.type.size&&!F.type.has(catOf(x.t)))return false;
    if(F.course.size&&!F.course.has(x.course))return false;return true;
  }).sort((a,b)=>(a.t.due_iso||'9').localeCompare(b.t.due_iso||'9')||a.course.localeCompare(b.course));
  $('#tcount').textContent=list.length+' shown'+(T.length>list.length?' - '+(T.length-list.length)+' hidden by filters':'');
  if(!list.length){$('#tasklist').innerHTML='<div class="empty mut">'+(T.length?'Nothing matches these filters.':'No tasks yet. Fill in AgentOS/.env and press Sync now.')+'</div>';return;}

  $('#tasklist').innerHTML=[...groups.entries()].map(([k,items])=>{
    const f=items[0];let head='<b>No date</b>';

  }).join('');
}

/* chat */
const history=[];
function md(s){return s.split(FENCE).map((p,i)=>{
  if(i%2===0)return esc(p).replace(/\x60([^\x60\n]+)\x60/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
  const nl=p.indexOf('\n'),lang=(nl>=0?p.slice(0,nl):'').trim().toLowerCase(),code=nl>=0?p.slice(nl+1):p;
  const ok=['bash','sh','shell','zsh','python','py'].includes(lang);
  return `<div class="code"><pre>${esc(code)}</pre>${ok?`<button class="run" data-lang="${lang.startsWith('py')?'python':'shell'}" data-code="${encodeURIComponent(code.trim())}">Run in terminal</button>`:''}</div>`;}).join('');}
$('#msgs').onclick=e=>{const b=e.target.closest('.run');if(!b)return;showTab('terminal');runCmd(decodeURIComponent(b.dataset.code),b.dataset.lang);};
function addMsg(role,html){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html;$('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;return d;}
async function send(){
  const text=$('#chatin').value.trim();if(!text)return;$('#chatin').value='';
  history.push({role:'user',content:text});addMsg('user',esc(text).replace(/\n/g,'<br>'));
  const el=addMsg('assistant','<span class="mut">...</span>');let acc='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    if(!r.ok){const e=await r.json().catch(()=>({}));el.innerHTML='<span class="err">'+esc(e.detail||'Chat failed')+'</span>';history.pop();return;}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let idx;while((idx=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,idx).trim();buf=buf.slice(idx+2);if(!line.startsWith('data:'))continue;
        const j=JSON.parse(line.slice(5));if(j.token){acc+=j.token;el.innerHTML=md(acc);$('#msgs').scrollTop=1e9;}if(j.error)el.innerHTML+='<div class="err">'+esc(j.error)+'</div>';}}
    history.push({role:'assistant',content:acc});
  }catch(e){el.innerHTML='<span class="err">'+esc(e.message)+'</span>';}
}
$('#chatsend').onclick=send;
$('#chatin').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};

const DEFAULT=[
  {type:'stats',x:0,y:0,w:4,h:6},{type:'homework',x:4,y:0,w:4,h:9},{type:'models',x:8,y:0,w:4,h:5},
  {type:'chat',x:8,y:5,w:4,h:9},{type:'terminal',x:0,y:6,w:4,h:8}
];

/* ---------- grid engine ---------- */
function place(w){const s=w.el.style;s.left=(w.x*cell+GAP)+'px';s.top=(w.y*ROW+GAP)+'px';s.width=(w.w*cell-2*GAP)+'px';s.height=(w.h*ROW-2*GAP)+'px'}
function layoutAll(skip){
  if(!grid.clientWidth)return;cell=grid.clientWidth/COLS;
  W.forEach(w=>{if(w!==skip)place(w)});
  if(skip){const s=ghost.style;s.left=(skip.x*cell+GAP)+'px';s.top=(skip.y*ROW+GAP)+'px';s.width=(skip.w*cell-2*GAP)+'px';s.height=(skip.h*ROW-2*GAP)+'px'}
  grid.style.height=(bottom()+3)*ROW+'px';
}
function resolve(m){let g=0;const q=[m];while(q.length&&g++<3000){const a=q.shift();for(const o of W){if(o!==a&&hit(a,o)){o.y=a.y+a.h;q.push(o)}}}}
function compact(fixedId){
  const fixed=W.find(w=>w.id===fixedId),placed=fixed?[fixed]:[];
  [...W].sort((a,b)=>a.y-b.y||a.x-b.x).forEach(w=>{
    if(w===fixed)return;
    while(w.y>0&&!placed.some(o=>hit({x:w.x,y:w.y-1,w:w.w,h:w.h},o)))w.y--;
    placed.push(w)});
}
function save(){clearTimeout(saveT);saveT=setTimeout(()=>post('/api/dashboard',{widgets:W.map(w=>({id:w.id,type:w.type,x:w.x,y:w.y,w:w.w,h:w.h}))}),300)}

function drag(e,w,mode){
  e.preventDefault();const target=e.currentTarget;target.setPointerCapture(e.pointerId);
  const st={px:e.clientX,py:e.clientY,x:w.x,y:w.y,w:w.w,h:w.h,left:w.el.offsetLeft,top:w.el.offsetTop,ww:w.el.offsetWidth,hh:w.el.offsetHeight};
  const snap=W.map(o=>({o:o,x:o.x,y:o.y,w:o.w,h:o.h}));
  w.el.classList.add('drag');ghost.style.display='block';
  const mv=ev=>{
    const dx=ev.clientX-st.px,dy=ev.clientY-st.py;
    snap.forEach(s=>{s.o.x=s.x;s.o.y=s.y;s.o.w=s.w;s.o.h=s.h});
    if(mode==='move'){
      w.x=clamp(st.x+Math.round(dx/cell),0,COLS-w.w);w.y=Math.max(0,st.y+Math.round(dy/ROW));
      w.el.style.left=(st.left+dx)+'px';w.el.style.top=(st.top+dy)+'px';
    }else{
      const mn=DEFS[w.type].min;
      w.w=clamp(st.w+Math.round(dx/cell),mn[0],COLS-w.x);w.h=Math.max(mn[1],st.h+Math.round(dy/ROW));
      w.el.style.width=Math.max(80,st.ww+dx)+'px';w.el.style.height=Math.max(80,st.hh+dy)+'px';
    }
    resolve(w);compact(w.id);layoutAll(w);
  };
  const up=()=>{target.removeEventListener('pointermove',mv);target.removeEventListener('pointerup',up);target.removeEventListener('pointercancel',up);
    w.el.classList.remove('drag');ghost.style.display='none';compact(null);layoutAll();save()};
  target.addEventListener('pointermove',mv);target.addEventListener('pointerup',up);target.addEventListener('pointercancel',up);
}
function build(w){
  const d=DEFS[w.type],el=document.createElement('div');el.className='w';
  el.innerHTML='<div class="wh"><span>'+d.title+'</span><button class="rm" title="Remove widget">&times;</button></div><div class="wb"></div><div class="rz"></div>';
  grid.appendChild(el);w.el=el;w.inst=d.mk(el.querySelector('.wb'))||{};
  el.querySelector('.wh').addEventListener('pointerdown',e=>{if(!edit||e.target.closest('.rm'))return;drag(e,w,'move')});
  el.querySelector('.rz').addEventListener('pointerdown',e=>{if(edit)drag(e,w,'size')});
  el.querySelector('.rm').onclick=()=>{w.inst.destroy&&w.inst.destroy();el.remove();W=W.filter(o=>o!==w);compact(null);layoutAll();save()};
}
function spawn(o){
  const d=DEFS[o.type];if(!d)return null;
  const w={id:o.id||uid(),type:o.type,w:clamp(+o.w||d.w,d.min[0],COLS),h:Math.max(d.min[1],+o.h||d.h),x:0,y:0};
  w.x=clamp(+o.x||0,0,COLS-w.w);w.y=o.y==null?bottom():Math.max(0,+o.y||0);
  W.push(w);build(w);return w;
}

/* ---------- toolbar ---------- */
$('#palette').innerHTML=Object.entries(DEFS).map(([k,d])=>'<button class="pi" data-t="'+k+'"><b>'+d.title+'</b><span class="mut small">'+d.desc+'</span></button>').join('');
$('#addw').onclick=e=>{e.stopPropagation();$('#palette').classList.toggle('show')};
document.addEventListener('click',e=>{if(!e.target.closest('#palette'))$('#palette').classList.remove('show')});
$('#palette').onclick=e=>{const b=e.target.closest('.pi');if(!b)return;$('#palette').classList.remove('show');
  const w=spawn({type:b.dataset.t});compact(null);layoutAll();save();refresh();w.el.scrollIntoView({block:'nearest',behavior:'smooth'})};
$('#editw').onclick=()=>{edit=!edit;dash.classList.toggle('edit',edit);$('#editw').textContent=edit?'Done':'Customize';$('#editw').classList.toggle('primary',!edit)};
$('#resetw').onclick=()=>{if(!confirm('Reset the dashboard to the default layout?'))return;
  W.forEach(w=>{w.inst.destroy&&w.inst.destroy();w.el.remove()});W=[];DEFAULT.forEach(spawn);compact(null);layoutAll();save();refresh()};

window.onStatus=s=>{fillModels($('#modelsel'),s);W.forEach(w=>w.inst&&w.inst.onStatus&&w.inst.onStatus(s))};
new ResizeObserver(()=>layoutAll()).observe(grid);
(async()=>{const r=await api('/api/dashboard');const L=r.data&&r.data.widgets;
  (Array.isArray(L)?L:DEFAULT).filter(i=>i&&DEFS[i.type]).forEach(spawn);compact(null);layoutAll();refresh()})();
})();

</script>
</body>
</html>
