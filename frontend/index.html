<!doctype html>
<html lang="en" data-mode="school">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentOS</title>
<style>
:root{--accent:#6366f1;--accent2:#8b5cf6;--stroke:rgba(255,255,255,.12);--tx:#eceef6;--mut:rgba(236,238,246,.58);--bad:#fb7185}
html[data-mode=dev]{--accent:#10b981;--accent2:#14b8a6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:14px;gap:14px;display:flex;background:#05060d;color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 800px at 80% 110%,#0d0a20,#05060d)}
.blob{position:absolute;border-radius:50%;filter:blur(130px);opacity:.2;transition:background 1s;animation:float 28s ease-in-out infinite alternate}
.b1{width:520px;height:520px;background:var(--accent);top:-180px;left:-140px}
.b2{width:480px;height:480px;background:var(--accent2);right:-160px;bottom:-160px;animation-delay:-9s}
.b3{width:340px;height:340px;background:#7c3aed;top:40%;left:44%;opacity:.08;animation-delay:-15s}
@keyframes float{to{transform:translate(60px,-40px) scale(1.12)}}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--stroke);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:rgba(255,255,255,.07);border:1px solid var(--stroke);border-radius:11px;padding:6px 13px;cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.14)}
button:disabled{opacity:.55;cursor:default}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
button.danger{background:rgba(244,63,94,.25);border-color:rgba(244,63,94,.5)}
button.danger:hover{background:rgba(244,63,94,.5)}
input,textarea,select{background:rgba(0,0,0,.3);border:1px solid var(--stroke);border-radius:11px;padding:8px 11px;width:100%}
select option{background:#14162e;color:#fff}
input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent)}
textarea{resize:vertical}
aside{width:210px;flex:none;padding:18px;display:flex;flex-direction:column;gap:6px}
aside h1{margin:0 0 12px;font-size:20px;background:linear-gradient(135deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.modes{display:flex;gap:6px;margin-bottom:12px;padding:4px;border-radius:14px;background:rgba(0,0,0,.3)}
.modes button{flex:1;border:0;background:none}.modes button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
#nav{display:flex;flex-direction:column;gap:4px}
.nav{text-align:left;border:0;background:none}.nav.active{background:rgba(255,255,255,.12)}
main{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
header{display:flex;gap:8px;padding:9px 14px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--stroke);background:rgba(255,255,255,.05);border-radius:99px;padding:2px 12px;font-size:12px;color:var(--mut)}
.msel{width:auto;max-width:210px;padding:3px 12px;border-radius:99px;font-size:12px;cursor:pointer}
#views{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;padding:16px}.view.active{display:flex;flex-direction:column}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.pane>*{flex:none}
.grow,.pane>.grow{flex:1 1 0;min-height:0;overflow:auto}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row input,.row textarea{flex:1;min-width:0}
.h1{font-size:21px;font-weight:650}
.mut{color:var(--mut)}.err{color:var(--bad)}.small{font-size:12px}
.card{background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:12px;padding:9px 13px}
.list{display:flex;flex-direction:column;gap:7px}
code{background:rgba(0,0,0,.4);padding:1px 6px;border-radius:6px}
.empty{padding:40px;text-align:center}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
/* markdown */
.md p{margin:0 0 4px}.md .sp{height:6px}.md h3,.md h4,.md h5,.md h6{margin:10px 0 4px}.md ul{margin:2px 0 6px;padding-left:20px}.md .li{padding-left:6px}
.md a{color:var(--accent2)}a.wl{cursor:pointer;text-decoration:underline dotted}
.code{margin:6px 0}.code pre{margin:0;background:rgba(0,0,0,.45);border:1px solid var(--stroke);border-radius:10px;padding:10px;overflow:auto;white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,monospace}
.run{margin-top:4px;font-size:12px}
/* dashboard */
#tab-dashboard.view{padding:0;gap:14px}
.dbar{display:flex;align-items:center;gap:10px;padding:10px 16px;position:relative;z-index:100}
#tab-dashboard .eo{display:none}#tab-dashboard.edit .eo{display:inline-block}
#dgw{flex:1;min-height:0;overflow:auto;border-radius:20px;position:relative;z-index:1}
#grid{position:relative}
#ghost{position:absolute;display:none;border-radius:18px;background:color-mix(in srgb,var(--accent) 18%,transparent);border:2px dashed var(--accent);transition:all .12s;pointer-events:none}
.w{position:absolute;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--stroke);box-shadow:0 10px 36px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);transition:left .18s,top .18s,width .18s,height .18s}
.w.drag{transition:none;z-index:50;box-shadow:0 24px 60px rgba(0,0,0,.6);opacity:.93}
.edit .w{outline:1px dashed color-mix(in srgb,var(--accent) 65%,transparent)}
.wh{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--stroke);user-select:none;touch-action:none}
.edit .wh{cursor:grab}.edit .wh:active{cursor:grabbing}
.rm{display:none;padding:0 9px;line-height:22px;font-size:16px}.edit .rm{display:inline-block}.rm:hover{background:rgba(244,63,94,.55)}
.rz{display:none;position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;z-index:5;touch-action:none}.edit .rz{display:block}
.rz::after{content:"";position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut)}
.wb{padding:10px 12px;overflow:auto}
.pal{position:absolute;right:0;top:calc(100% + 8px);z-index:200;width:330px;display:none;flex-direction:column;gap:2px;padding:8px;background:#14162e;border:1px solid var(--stroke);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.pal.show{display:flex}
.pi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:none;width:100%}.pi:hover{background:rgba(255,255,255,.1)}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.spark{width:100%;height:48px}
.tlog{margin:0;background:rgba(0,0,0,.4);border:1px solid var(--stroke);border-radius:10px;padding:8px;white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace}
/* chips + homework */
.fgrp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flabel{width:58px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.chip{--c:var(--accent);padding:3px 11px;border-radius:99px;font-size:12.5px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:color-mix(in srgb,var(--c) 32%,transparent);border-color:var(--c)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.filters{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--stroke)}
.csec{margin-bottom:14px}.chead{--c:var(--accent);display:flex;gap:8px;align-items:center;margin:4px 2px 8px}.chead b{font-size:15px}
.day{margin-bottom:12px}.dayhead{display:flex;gap:10px;align-items:baseline;margin:4px 2px 8px}.dayhead .rel{font-size:12px;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.08)}.dayhead .rel.hot{background:rgba(244,63,94,.3)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:122px;gap:10px}
.task{--c:#6366f1;position:relative;height:100%;padding:10px 12px 10px 17px;border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 20%,transparent),color-mix(in srgb,var(--c) 5%,transparent));border:1px solid color-mix(in srgb,var(--c) 36%,transparent);box-shadow:0 4px 16px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .15s}
.task:hover{transform:translateY(-2px)}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.task .top{font-size:11px;letter-spacing:.03em;color:color-mix(in srgb,var(--c) 45%,#fff);display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.task .top span:first-child{overflow:hidden;text-overflow:ellipsis}.task .top.hot{color:#fda4af}
.task .t{font-weight:600;line-height:1.3;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.task .meta{margin-top:auto;display:flex;gap:6px;overflow:hidden;white-space:nowrap}
.task.done{opacity:.5}.task.done .t{text-decoration:line-through}.ok{color:#86efac}
.badge{font-size:11px;padding:1px 9px;border-radius:99px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1)}
.hwi{--c:var(--accent);border-left:4px solid var(--c);background:linear-gradient(120deg,color-mix(in srgb,var(--c) 20%,transparent),rgba(255,255,255,.02));border-radius:10px;padding:7px 10px;cursor:pointer}
.hwi:hover{filter:brightness(1.2)}.hwt{font-weight:600;font-size:13px;line-height:1.3}
.hwm{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);gap:8px}.hwm .hot{color:#fda4af}
.spin{display:none;width:12px;height:12px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;margin-right:8px;vertical-align:-1px}
.busy .spin{display:inline-block}@keyframes rot{to{transform:rotate(360deg)}}
/* chat */
.cbar{flex-wrap:wrap;justify-content:flex-start}.cbar select{width:auto;min-width:0;flex:1;max-width:100%}
.cmsgs{display:flex;flex-direction:column;gap:8px}
.msg{padding:9px 13px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);max-width:880px;font-size:13.5px}
.msg.user{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 32%,transparent),color-mix(in srgb,var(--accent2) 18%,transparent));align-self:flex-end}
.tools{margin-bottom:5px}.tool{font-size:11px;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.1);margin-right:4px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* notes + misc */
.nt{display:flex;gap:10px;flex:1;min-height:0}
.nl{width:220px;flex:none;display:flex;flex-direction:column;gap:8px;min-height:0}
.nv{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.nt:not(.wide) .nl{width:100%}.nt:not(.wide).open .nl{display:none}.nt:not(.wide):not(.open) .nv{display:none}.nt.wide .nb{display:none}
.ni{padding:5px 9px;border-radius:8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni:hover{background:rgba(255,255,255,.09)}.ni.on{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.fh{margin:8px 4px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.nbody{padding:2px}.nbody.ed{display:flex;overflow:hidden}.nbody.ed textarea{flex:1;min-height:0;resize:none;font:13px/1.5 ui-monospace,Menlo,monospace}
.grid2{display:grid;grid-template-columns:240px 1fr;gap:12px;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.sk{cursor:pointer}.skb{display:none;white-space:pre-wrap;margin:6px 0 0;font-size:12px}.sk.open .skb{display:block}
.mopt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;--c:var(--accent)}
.mopt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 26%,transparent)}.mopt em{margin-left:auto;font-style:normal;font-size:11px;color:var(--accent)}
.fi{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer}.fi:hover{background:rgba(255,255,255,.1)}
.fv{white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;margin:8px 0 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:300}
#modal .box{padding:22px;max-width:560px;width:92%;background:#14162e;border-color:rgba(251,113,133,.6)}
#modal pre{background:rgba(0,0,0,.45);padding:10px;border-radius:10px;white-space:pre-wrap;overflow:auto}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;padding:9px 18px;border-radius:99px;background:rgba(20,22,46,.95);border:1px solid var(--stroke);transition:.25s;pointer-events:none;z-index:400}
#toast.show{opacity:1;transform:translate(-50%,0)}
.locbar{padding-bottom:4px}
.lbody{overflow:hidden!important}
.fnt .nl{width:300px}
.fi span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fview pre.fv{margin:0}

</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<aside class="glass">
  <h1>AgentOS</h1>
  <div class="modes"><button id="m-school">School</button><button id="m-dev">Dev</button></div>
  <div id="nav"></div>
</aside>
<main>
  <header class="glass"><span class="pill" id="p-mode"></span><span class="pill" id="p-ollama"></span><select id="modelsel" class="msel" title="Active model"></select><span class="pill" id="p-cpu"></span><span class="pill" id="p-ram"></span><span class="pill" id="p-tasks"></span></header>
  <div id="views">
    <section id="tab-dashboard" class="view dash">
      <div class="glass dbar">
        <div class="h1">Dashboard</div>
        <span class="mut small eo">Drag a title bar to move, drag the corner to resize</span>
        <span style="flex:1"></span>
        <div style="position:relative"><button id="addw">+ Add widget</button><div id="palette" class="pal"></div></div>
        <button id="resetw" class="eo">Reset</button>
        <button id="editw" class="primary">Customize</button>
      </div>
      <div id="dgw"><div id="grid"><div id="ghost"></div></div></div>
    </section>
  </div>
</main>
<div id="modal"><div class="box glass">
  <h3 class="err" style="margin-top:0">High-risk command - confirmation required</h3>
  <pre id="m-cmd"></pre><div id="m-why" class="mut"></div><br>
  <div class="row" style="justify-content:flex-end"><button id="m-abort">Abort</button><button class="danger" id="m-ok">Authorize Execution</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s),FENCE='\x60'.repeat(3);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function req(method,url,body){const o={method:method,headers:{'Content-Type':'application/json'}};if(body!==undefined)o.body=JSON.stringify(body);const r=await fetch(url,o);let d=null;try{d=await r.json()}catch(e){}return{ok:r.ok,status:r.status,data:d}}
const api=u=>req('GET',u),post=(u,b)=>req('POST',u,b),put=(u,b)=>req('PUT',u,b),del=u=>req('DELETE',u);
const errOf=r=>{const d=r.data&&r.data.detail;return d?(typeof d==='string'?d:JSON.stringify(d)):'Error '+r.status};
let MODE='school';const INST=new Set(),TI={};
const reg=i=>{i=i||{};INST.add(i);return i};
function toast(t){let d=$('#toast');if(!d){d=document.createElement('div');d.id='toast';document.body.appendChild(d)}d.textContent=t;d.classList.add('show');clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove('show'),2800)}

/* ---------- markdown ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/\x60([^\x60\n]+)\x60/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  s=s.replace(/\[\[([^\]\n]+)\]\]/g,(m,n)=>{const p=n.split('|');return '<a class="wl" data-n="'+p[0].trim()+'">'+(p[1]||p[0])+'</a>'});
  s=s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}
function md(src){
  const out=[];
  String(src||'').split(FENCE).forEach((p,i)=>{
    if(i%2===1){
      const nl=p.indexOf('\n'),lang=(nl>=0?p.slice(0,nl):'').trim().toLowerCase(),code=nl>=0?p.slice(nl+1):p;
      const ok=MODE==='dev'&&['bash','sh','shell','zsh','python','py'].indexOf(lang)>=0;
      out.push('<div class="code"><pre>'+esc(code)+'</pre>'+(ok?'<button class="run" data-lang="'+(lang.indexOf('py')===0?'python':'shell')+'" data-code="'+encodeURIComponent(code.trim())+'">Run in terminal</button>':'')+'</div>');
      return;
    }
    let list=false;
    p.split('\n').forEach(line=>{
      let m;
      if((m=line.match(/^(#{1,4})\s+(.*)/))){if(list){out.push('</ul>');list=false}const n=m[1].length+2;out.push('<h'+n+'>'+inline(m[2])+'</h'+n+'>')}
      else if((m=line.match(/^\s*[-*]\s+(.*)/))){if(!list){out.push('<ul>');list=true}out.push('<li>'+inline(m[1])+'</li>')}
      else{if(list){out.push('</ul>');list=false}
        if(/^\s*\d+[.)]\s+/.test(line))out.push('<p class="li">'+inline(line.trim())+'</p>');
        else out.push(line.trim()?'<p>'+inline(line)+'</p>':'<div class="sp"></div>')}
    });
    if(list)out.push('</ul>');
  });
  return out.join('');
}

/* ---------- models ---------- */
function fillModels(sel,s){
  const o=s.ollama||{},names=o.available||[],key=names.join('|');
  if(sel.dataset.key!==key){sel.innerHTML=names.length?names.map(n=>'<option>'+esc(n)+'</option>').join(''):'<option value="">no models</option>';sel.dataset.key=key}
  if(o.model&&document.activeElement!==sel)sel.value=o.model;
}
async function setModel(m){if(!m)return;const r=await post('/api/model',{model:m});toast(r.ok?'Model: '+m:errOf(r));refresh()}
$('#modelsel').onchange=e=>setModel(e.target.value);

/* ---------- terminal ---------- */
let pend=null;
function showRes(out,d){if(d.stdout)out(d.stdout.trimEnd());if(d.stderr)out(d.stderr.trimEnd());out('[exit '+d.exit_code+']\n')}
async function termRun(out,command,lang){
  out('$ '+command);
  const r=await post('/api/terminal/execute',{command:command,language:lang||'shell'});
  if(r.status===403&&r.data&&r.data.status==='requires_confirmation'){pend={token:r.data.token,out:out};$('#m-cmd').textContent=r.data.command;$('#m-why').textContent='Flagged: '+r.data.reasons.join('; ');$('#modal').style.display='flex';return}
  if(!r.ok){out('Error: '+errOf(r));return}
  showRes(out,r.data);
}
$('#m-abort').onclick=()=>{$('#modal').style.display='none';if(pend){pend.out('[aborted by user]\n');pend=null}};
$('#m-ok').onclick=async()=>{$('#modal').style.display='none';if(!pend)return;const p=pend;pend=null;const r=await post('/api/terminal/authorize',{token:p.token});if(!r.ok){p.out('Error: '+errOf(r));return}showRes(p.out,r.data)};

/* ---------- homework data ---------- */
const HW={tasks:[],meta:{},subs:new Set()};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysTo=t=>t.due_iso?Math.round((new Date(t.due_iso).setHours(0,0,0,0)-today0())/864e5):null;
const rel=d=>d===null?'':d===0?'Today':d===1?'Tomorrow':d<0?(-d)+'d overdue':'in '+d+' days';

async function doSync(btn,msg,idle,busy){

function mkChat(b){
  b.innerHTML='<div class="row cbar"><select class="csel" title="Chat history"></select><button class="cnew">+ New</button><button class="cren">Rename</button><button class="cdel">Delete</button><select class="msel cm" title="Model"></select></div><div class="grow cmsgs"></div><div class="row"><textarea rows="2" placeholder="Message... (Enter to send, Shift+Enter for a new line)"></textarea><button class="primary go">Send</button></div>';
  const csel=b.querySelector('.csel'),cm=b.querySelector('.cm'),msgs=b.querySelector('.cmsgs'),ta=b.querySelector('textarea'),go=b.querySelector('.go');
  const KEY='aos.chat.'+MODE;let list=[],cur=localStorage.getItem(KEY),busy=false;
  cm.onchange=()=>setModel(cm.value);
  const paint=(el,m)=>{el.innerHTML=(m.tools&&m.tools.length?'<div class="tools">'+m.tools.map(t=>'<span class="tool">'+esc((TL[t.name]||t.name)+(toolArg(t)?': '+toolArg(t):''))+'</span>').join('')+'</div>':'')+md(m.content||'')+(m.notice?'<div class="mut small">'+esc(m.notice)+'</div>':'')};
  const add=(role,m)=>{const d=document.createElement('div');d.className='msg '+role+' md';if(role==='user')d.innerHTML=esc(m.content).replace(/\n/g,'<br>');else paint(d,m);msgs.appendChild(d);msgs.scrollTop=1e9;return d};
  async function openChat(id){
    const r=await api('/api/chats/'+MODE+'/'+id);if(!r.ok)return false;
    cur=id;localStorage.setItem(KEY,id);msgs.innerHTML='';
    r.data.messages.forEach(m=>add(m.role,m));
    if(!r.data.messages.length)msgs.innerHTML='<div class="empty mut">New chat. I can search the web and read and write your notes.</div>';
    return true;
  }
  async function reload(open){
    const r=await api('/api/chats?mode='+MODE);list=(r.data&&r.data.chats)||[];
    if(!list.length){const n=await post('/api/chats',{mode:MODE});if(!n.ok)return;cur=n.data.id;list=[{id:cur,title:n.data.title}]}
    if(!cur||!list.some(c=>c.id===cur))cur=list[0].id;
    csel.innerHTML=list.map(c=>'<option value="'+c.id+'">'+esc(c.title)+'</option>').join('');csel.value=cur;
    if(open)await openChat(cur);
  }
  csel.onchange=()=>openChat(csel.value);
  b.querySelector('.cnew').onclick=async()=>{const r=await post('/api/chats',{mode:MODE});if(r.ok){cur=r.data.id;await reload(true)}};
  b.querySelector('.cren').onclick=async()=>{const c=list.find(x=>x.id===cur);const t=prompt('Rename chat',c?c.title:'');if(t&&t.trim()){await post('/api/chats/'+MODE+'/'+cur+'/rename',{title:t.trim()});reload(false)}};
  b.querySelector('.cdel').onclick=async()=>{if(!confirm('Delete this chat? This cannot be undone.'))return;await del('/api/chats/'+MODE+'/'+cur);cur=null;await reload(true)};
  msgs.onclick=e=>{const r=e.target.closest('.run');if(!r)return;showTab('terminal');termRun(window.termTab||(()=>{}),decodeURIComponent(r.dataset.code),r.dataset.lang)};
  async function send(){

    ta.value='';busy=true;go.disabled=true;

    add('user',{content:text});
    const m={content:'',tools:[]},el=add('assistant',m);el.innerHTML='<span class="mut">thinking...</span>';
    try{
      const r=await fetch('/api/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:MODE,chat_id:cur,text:text})});
      if(!r.ok){const e=await r.json().catch(()=>({}));el.innerHTML='<span class="err">'+esc(e.detail||'Chat failed')+'</span>';busy=false;go.disabled=false;return}
      const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){const x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let i;
        while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+2);if(line.indexOf('data:')!==0)continue;
          const j=JSON.parse(line.slice(5));
          if(j.token)m.content+=j.token;if(j.tool)m.tools.push(j.tool);if(j.notice)m.notice=j.notice;if(j.error)m.content+='\n\n**Error:** '+j.error;
          paint(el,m);msgs.scrollTop=1e9}}
    }catch(e){el.innerHTML+='<div class="err">'+esc(e.message)+'</div>'}

  }
  go.onclick=send;

}

};
function initDash(){
  const COLS=12,ROW=50,GAP=6,grid=$('#grid'),ghost=$('#ghost'),dash=$('#tab-dashboard');
  const D={};ALLOW[MODE].forEach(k=>D[k]=DEFS[k]);
  let W=[],cell=100,edit=false,saveT=null;
  const clamp=(v,a,c)=>Math.max(a,Math.min(c,v)),uid=()=>'w'+Math.random().toString(36).slice(2,8);
  const hit=(a,c)=>a.x<c.x+c.w&&a.x+a.w>c.x&&a.y<c.y+c.h&&a.y+a.h>c.y;
  const bottom=()=>Math.max(0,...W.map(o=>o.y+o.h));
  function place(w){const s=w.el.style;s.left=(w.x*cell+GAP)+'px';s.top=(w.y*ROW+GAP)+'px';s.width=(w.w*cell-2*GAP)+'px';s.height=(w.h*ROW-2*GAP)+'px'}
  function layoutAll(skip){
    if(!grid.clientWidth)return;cell=grid.clientWidth/COLS;
    W.forEach(w=>{if(w!==skip)place(w)});
    if(skip){const s=ghost.style;s.left=(skip.x*cell+GAP)+'px';s.top=(skip.y*ROW+GAP)+'px';s.width=(skip.w*cell-2*GAP)+'px';s.height=(skip.h*ROW-2*GAP)+'px'}
    grid.style.height=(bottom()+3)*ROW+'px';
  }
  function resolve(m){let g=0;const q=[m];while(q.length&&g++<3000){const a=q.shift();for(const o of W){if(o!==a&&hit(a,o)){o.y=a.y+a.h;q.push(o)}}}}
  function compact(fid){
    const fixed=W.find(w=>w.id===fid),placed=fixed?[fixed]:[];
    [...W].sort((a,c)=>a.y-c.y||a.x-c.x).forEach(w=>{if(w===fixed)return;while(w.y>0&&!placed.some(o=>hit({x:w.x,y:w.y-1,w:w.w,h:w.h},o)))w.y--;placed.push(w)});
  }
  function save(){clearTimeout(saveT);saveT=setTimeout(()=>post('/api/layout/'+MODE,{widgets:W.map(w=>({id:w.id,type:w.type,x:w.x,y:w.y,w:w.w,h:w.h}))}),300)}
  function drag(e,w,mode){
    e.preventDefault();const target=e.currentTarget;target.setPointerCapture(e.pointerId);
    const st={px:e.clientX,py:e.clientY,x:w.x,y:w.y,w:w.w,h:w.h,left:w.el.offsetLeft,top:w.el.offsetTop,ww:w.el.offsetWidth,hh:w.el.offsetHeight};
    const snap=W.map(o=>({o:o,x:o.x,y:o.y,w:o.w,h:o.h}));
    w.el.classList.add('drag');ghost.style.display='block';
    const mv=ev=>{
      const dx=ev.clientX-st.px,dy=ev.clientY-st.py;
      snap.forEach(s=>{s.o.x=s.x;s.o.y=s.y;s.o.w=s.w;s.o.h=s.h});
      if(mode==='move'){w.x=clamp(st.x+Math.round(dx/cell),0,COLS-w.w);w.y=Math.max(0,st.y+Math.round(dy/ROW));w.el.style.left=(st.left+dx)+'px';w.el.style.top=(st.top+dy)+'px'}
      else{const mn=D[w.type].min;w.w=clamp(st.w+Math.round(dx/cell),mn[0],COLS-w.x);w.h=Math.max(mn[1],st.h+Math.round(dy/ROW));w.el.style.width=Math.max(80,st.ww+dx)+'px';w.el.style.height=Math.max(80,st.hh+dy)+'px'}
      resolve(w);compact(w.id);layoutAll(w);
    };
    const up=()=>{target.removeEventListener('pointermove',mv);target.removeEventListener('pointerup',up);target.removeEventListener('pointercancel',up);w.el.classList.remove('drag');ghost.style.display='none';compact(null);layoutAll();save()};
    target.addEventListener('pointermove',mv);target.addEventListener('pointerup',up);target.addEventListener('pointercancel',up);
  }
  function build(w){
    const d=D[w.type],el=document.createElement('div');el.className='w';
    el.innerHTML='<div class="wh"><span>'+d.title+'</span><button class="rm" title="Remove widget">&times;</button></div><div class="pane wb"></div><div class="rz"></div>';
    grid.appendChild(el);w.el=el;w.inst=reg(d.mk(el.querySelector('.wb'),false));
    el.querySelector('.wh').addEventListener('pointerdown',e=>{if(!edit||e.target.closest('.rm'))return;drag(e,w,'move')});
    el.querySelector('.rz').addEventListener('pointerdown',e=>{if(edit)drag(e,w,'size')});
    el.querySelector('.rm').onclick=()=>{if(w.inst.destroy)w.inst.destroy();INST.delete(w.inst);el.remove();W=W.filter(o=>o!==w);compact(null);layoutAll();save()};
  }
  function spawn(o){
    const d=D[o&&o.type];if(!d)return null;
    const w={id:o.id||uid(),type:o.type,w:clamp(+o.w||d.w,d.min[0],COLS),h:Math.max(d.min[1],+o.h||d.h),x:0,y:0};
    w.x=clamp(+o.x||0,0,COLS-w.w);w.y=o.y==null?bottom():Math.max(0,+o.y||0);
    W.push(w);build(w);return w;
  }
  const pal=$('#palette');
  pal.innerHTML=Object.keys(D).map(k=>'<button class="pi" data-t="'+k+'"><b>'+D[k].title+'</b><span class="mut small">'+D[k].desc+'</span></button>').join('');
  $('#addw').onclick=e=>{e.stopPropagation();pal.classList.toggle('show')};
  document.addEventListener('click',e=>{if(!e.target.closest('#palette')&&!e.target.closest('#addw'))pal.classList.remove('show')});
  pal.onclick=e=>{const bt=e.target.closest('.pi');if(!bt)return;pal.classList.remove('show');
    const w=spawn({type:bt.dataset.t});compact(null);layoutAll();save();refresh();if(w)w.el.scrollIntoView({block:'nearest',behavior:'smooth'})};
  $('#editw').onclick=()=>{edit=!edit;dash.classList.toggle('edit',edit);$('#editw').textContent=edit?'Done':'Customize';$('#editw').classList.toggle('primary',!edit)};
  $('#resetw').onclick=()=>{if(!confirm('Reset the dashboard to the default layout?'))return;
    W.forEach(w=>{if(w.inst.destroy)w.inst.destroy();INST.delete(w.inst);w.el.remove()});W=[];DEFAULTS[MODE].forEach(spawn);compact(null);layoutAll();save();refresh()};
  new ResizeObserver(()=>layoutAll()).observe(grid);
  api('/api/layout/'+MODE).then(r=>{const L=r.data&&r.data.widgets;
    (Array.isArray(L)&&L.length?L:DEFAULTS[MODE]).filter(i=>i&&D[i.type]).forEach(spawn);compact(null);layoutAll();refresh()});
}

/* ---------- tabs + init ---------- */
const ALL={dashboard:'Dashboard',chat:'Agent Chat',homework:'Homework',terminal:'Terminal',notes:'Second Brain + Files',skills:'Skills',memory:'Memory'};
const TABS={school:['dashboard','chat','homework','notes','skills','memory'],dev:['dashboard','chat','terminal','notes','skills','memory']};
const TABF={chat:mkChat,homework:mkHomeFull,terminal:mkTerm,notes:mkBrain,skills:mkSkillEd,memory:mkMem};
function showTab(t){
  if(TABS[MODE].indexOf(t)<0)t='dashboard';
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t));
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===t));
  localStorage.setItem('aos.tab.'+MODE,t);
  if(TI[t]&&TI[t].onShow)TI[t].onShow();
  window.dispatchEvent(new Event('resize'));
}
function buildTabs(){
  TABS[MODE].forEach(t=>{
    const n=document.createElement('button');n.className='nav';n.dataset.tab=t;n.textContent=ALL[t];n.onclick=()=>showTab(t);$('#nav').appendChild(n);
    if(t==='dashboard')return;
    const s=document.createElement('section');s.id='tab-'+t;s.className='glass view';s.innerHTML='<div class="pane"></div>';$('#views').appendChild(s);
    TI[t]=reg(TABF[t](s.firstChild,true));
  });
}
let lastSync;
async function refresh(){
  const r=await api('/api/status');if(!r.ok)return;const s=r.data;
  $('#p-mode').textContent='Mode: '+s.mode;
  $('#p-ollama').textContent=s.ollama.online?('Ollama - '+(s.ollama.model||'no model installed')):'Ollama offline';
  $('#p-cpu').textContent='CPU '+s.cpu_percent+'%';$('#p-ram').textContent='RAM '+s.ram.used_gb+'/'+s.ram.total_gb+' GB ('+s.ram.percent+'%)';
  $('#p-tasks').textContent=MODE==='school'?s.task_count+' tasks':'';$('#p-tasks').style.display=MODE==='school'?'':'none';
  fillModels($('#modelsel'),s);
  INST.forEach(i=>{if(i.onStatus)i.onStatus(s)});
  if(MODE==='school'){if(lastSync!==undefined&&s.last_sync!==lastSync)loadTasks();lastSync=s.last_sync}
}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=async()=>{const m=b.id.slice(2);if(m===MODE)return;await post('/api/mode',{mode:m});location.reload()});
(async function init(){
  const r=await api('/api/status');if(r.ok)MODE=r.data.mode;
  document.documentElement.dataset.mode=MODE;$('#m-'+MODE).classList.add('active');
  buildTabs();initDash();
  if(MODE==='school')loadTasks();
  showTab(localStorage.getItem('aos.tab.'+MODE)||'dashboard');
  refresh();setInterval(refresh,3000);
})();
</script>
